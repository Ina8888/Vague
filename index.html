<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    /*
      Declare Besport as a local system font so the browser's canvas
      renderer can find it. If you also have the .ttf/.otf file, copy it
      into a fonts/ folder and add the url() source below.
    */
    @font-face {
      font-family: "Besport";
      src: local("Besport");
      /* If you have the font file: */
      /* src: local("Besport"), url("fonts/Besport.ttf") format("truetype"); */
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Besport", sans-serif;
      color: #fff;
      user-select: none;
    }

    /* Seamlessly scale the camera / project canvas to fit the screen */
    canvas {
      display: block;
      width: min(100vw, calc(100vh * (16 / 9))) !important;
      height: min(100vh, calc(100vw * (9 / 16))) !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    /* Stretch fill for non-16:9 displays if toggled */
    body.fill-screen canvas {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
    }

    #loading-message {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #060a12;
      font-family: "Besport", sans-serif;
      font-size: 56px;
      letter-spacing: 0.28em;
      color: #00e6ff;
      text-shadow: 0 0 8px #00e6ff, 0 0 24px #00e6ff;
      z-index: 9999;
    }
    #loading-message.is-hidden { display: none; }
  </style>
</head>
<body>
  <div id="loading-message">LOADING</div>

  <!-- Tone.js Audio Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <!-- MIDI controller (WebSocket client to midi-bridge.js) -->
  <script src="midi-controller.js"></script>

  <!-- Music mode engine -->
  <script src="music-tracks.js?v=20"></script>

  <!-- Control the World mode engine -->
  <script src="control-world.js?v=11"></script>

  <!-- Main app — ES module for CDN imports -->
  <script type="module" src="colorful-track.js?v=27"></script>
</body>
</html>
